[package]
name = "pawn-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "=0.10.0"
dunce = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"
notify = "=8.2.1"
ignore = "=0.4.34"
regex = "1"
trash = "=5.2.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "pawn-lsp-bridge"
path = "src/bin/lsp_bridge.rs"
