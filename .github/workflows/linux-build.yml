name: Linux build

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore: ["**/*.md", "docs/**", "wiki/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "wiki/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      GOTOOLCHAIN: local
      GOTELEMETRY: "off"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install desktop and compiler prerequisites
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev pkg-config libc6:i386 zip unzip xvfb x11-utils

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Read and validate release versions
        id: settings
        run: node scripts/release-support.mjs

      - name: Set up Go for the pinned language server
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.settings.outputs.go }}
          cache: false

      - name: Set up the pinned Rust toolchain
        env:
          RUST_VERSION: ${{ steps.settings.outputs.rust }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt

      - name: Cache native dependencies and verified tools
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: linux-x64-${{ hashFiles('toolchain/tools-linux.json', 'toolchain/pawnlsp-build.json', 'toolchain/patches/**', 'scripts/build-pawnlsp.mjs', 'scripts/go-toolchain.mjs', 'scripts/lsp-build-record.mjs', 'scripts/prepare-tools.mjs', 'scripts/toolchain-target.mjs', 'scripts/tool-archive.mjs') }}
          cache-directories: |
            .tools-cache
            src-tauri/binaries
          save-if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}

      - name: Install npm dependencies
        run: |
          npm install --global npm@10.9.2
          npm ci

      - name: Check frontend and packaging code
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run audit:localization
          npm test
          npm run test:grammar
          npm run test:release

      - name: Prepare checksum-verified bundled tools
        run: npm run tools:prepare -- --download --reproducible

      - name: Check native formatting, lint and real tools
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml -p pawn-core --locked
          cargo test --manifest-path src-tauri/Cargo.toml -p pawn-core --test compiler_integration --locked -- --ignored
          npm run test:tools

      - name: Prepare dependency notices
        run: npm run release:linux:notices

      - name: Build the Linux Debian package
        run: npm run tauri -- build --ci --config src-tauri/tauri.linux.conf.json --bundles deb -- --locked

      - name: Verify bundled tools and assemble the ZIP
        id: package
        run: npm run release:linux:package

      - name: Install and smoke-test the packaged application
        env:
          DEB: ${{ steps.package.outputs.deb }}
        run: |
          sudo apt-get install -y "$DEB"
          xvfb-run -a npm run release:linux:smoke

      - name: Upload the ZIP directly
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload the SHA-256 checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.checksum }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Summarize the build
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo '## ompide Linux x64' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download ZIP]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Debian/Ubuntu installer, bundled pawnlsp/compiler/library, licenses and checksums. Installed startup checked under Xvfb; interactive desktop testing remains separate.' >> "$GITHUB_STEP_SUMMARY"
